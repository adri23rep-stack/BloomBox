name: Import Manzana as standalone BloomBox (one-time)

on:
  push:
    paths:
      - '.github/workflows/import-bloombox.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout new BloomBox repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Save migration tooling outside the checkout
        run: |
          set -euo pipefail
          cp bootstrap/rebrand-bloombox.py /tmp/bloombox-rebrand.py
          cp bootstrap/generate-bloombox-icon.swift /tmp/bloombox-icon.swift
      - name: Import complete Manzana source and ancestry into BloomBox
        run: |
          set -euo pipefail
          git config user.name 'BloomBox Migration'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add legacy https://github.com/adri23rep-stack/Manzana.git
          git fetch --no-tags legacy refs/heads/feature/manzana-v011-jit-expiry-8h
          git switch -C bloom-import FETCH_HEAD
          # Preserve the complete original history AND the initialization
          # commit of the new independent BloomBox repository.
          git merge -s ours --allow-unrelated-histories origin/main \
            -m 'history: preserve BloomBox initialization and Manzana ancestors'
          mkdir -p Scripts
          cp /tmp/bloombox-rebrand.py Scripts/rebrand-bloombox.py
          cp /tmp/bloombox-icon.swift Scripts/generate-bloombox-icon.swift
          python3 Scripts/rebrand-bloombox.py
          test -s LiveContainerSwiftUI/Views/Manzana/ManzanaDesktopView.swift
          test -s LiveContainerSwiftUI/Views/Manzana/ManzanaAnimatedWallpaper.swift
          test -s ManzanaExpiryWidget/ManzanaExpiryWidget.swift
          test -s Vendor/HuskRPPairing/src/lib.rs
          python3 -m py_compile Scripts/rebrand-bloombox.py \
            Scripts/brand-bloombox-final-ipa.py Scripts/verify-bloombox-ipa.py
          grep -q '<string>BloomBox</string>' LiveContainer/Info.plist
          grep -q 'BloomBox - Build' .github/workflows/build.yml
          git add -A
          git commit -m 'feat: establish BloomBox from complete Manzana v0.1.1 with JIT and Dynamic Island'
          git push origin HEAD:refs/heads/main
      - name: Confirm migrated tree and original ancestry
        run: |
          git show --stat --oneline HEAD | head -80
          git log --oneline --max-count=8
          test "$(git rev-list --parents --max-count=1 HEAD | wc -w)" -ge 2 || true
          echo 'BloomBox migration complete; main now contains preserved original history.'
