name: JIT pairing source checks

on:
  push:
    branches:
      - feature/jit-pairing-simple-advanced-20261107
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  pairing-source:
    name: Parse JIT source and verify the bridge
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test JIT bridge and pairing UI contracts
        run: python3 Tests/jit-bridge-tests/test_bridge.py
      - name: Parse modified Swift files without downloading third-party binaries
        run: |
          xcrun swiftc -frontend -parse LiveContainerSwiftUI/Views/BloomBox/BloomBoxJITSetup.swift
          xcrun swiftc -frontend -parse LiveContainerSwiftUI/Views/BloomBox/BloomBoxJITCoordinator.swift
