name: Verify original Playnite Switch theme package
on:
  push:
    branches:
      - feature/gamebox-playnite-theme-bridge-20261109
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-package:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Download original Nintendo Switch-ish 2.0 release
        run: |
          curl -fL --retry 3 --connect-timeout 20 --max-time 120 \
            "https://github.com/davidkgriggs/Nintendo-Switch-ish/releases/download/v2.0.0/Nintendo_Switch-ish_0d020ed5-0f3c-4c1a-bf9a-c983ef7d74b7_2_0_0.pthm" \
            -o theme.pthm
      - name: Inspect original archive layout and expected files
        run: |
          python3 - <<'PY'
          import zipfile, pathlib, sys, hashlib
          file = pathlib.Path("theme.pthm")
          print(f"Original package size={file.stat().st_size} bytes sha256={hashlib.sha256(file.read_bytes()).hexdigest()}")
          with zipfile.ZipFile(file) as archive:
              paths = {n.replace(chr(92), "/").lstrip("/") for n in archive.namelist()}
              print("Entry count:", len(paths))
              manifests = sorted(x for x in paths if x.lower().endswith("theme.yaml"))
              print("Candidate manifests:", manifests[:20])
              for name in ["theme.yaml", "Constants.xaml", "Views/Main.xaml", "Images/applogo_clean.png",
                           "Images/settings.png", "Images/wifi.png"]:
                  candidates = sorted(x for x in paths if x == name or x.endswith("/" + name))
                  print(name, ":", candidates[:3])
              assert manifests, "Missing theme.yaml"
              assert any(x.endswith("Constants.xaml") for x in paths), "Missing Constants.xaml"
              assert any(x.endswith("Views/Main.xaml") for x in paths), "Missing Views/Main.xaml"
              assert any(x.endswith("Images/applogo_clean.png") for x in paths), "Missing logo"
              manifest_text = archive.read(manifests[0]).decode("utf-8-sig")
              print("Theme manifest:\n", manifest_text[:1200])
              assert "Nintendo Switch-ish_0d020ed5-0f3c-4c1a-bf9a-c983ef7d74b7" in manifest_text
          PY
